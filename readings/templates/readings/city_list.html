{% extends "readings/base.html" %}

{% block title %}Cities{% endblock %}

{% block content %}
  <h1>Cities</h1>
    <p><a href="{% url 'city_create' %}">Add city</a></p>
  <table>
    <thead>
      <tr><th>Name</th><th>Country</th><th>Readings</th></tr>
    </thead>
    <tbody>
      {% for city in cities %}
        <tr>
          <td><a href="{% url 'city_detail' city.pk %}">{{ city.name }}</a></td>
          <td>{{ city.country }}</td>
          <td>{{ city.reading_count }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="3">No cities yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
