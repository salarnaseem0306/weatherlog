<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}WeatherLog{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'city_list' %}">Cities</a>
  </nav>
    <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
